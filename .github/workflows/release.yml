# Publishes one package to npm when its tag is pushed:
#   space-utilization-v1.2.3 → @strauteka/space-utilization
#   bin-packing-v1.2.3       → @strauteka/bin-packing
# Uses npm Trusted Publishing: GitHub proves the build came from this workflow, so no npm
# token is stored anywhere. Each package needs its own trusted publisher entry on npmjs.com.
name: release

on:
  push:
    tags: ['space-utilization-v*', 'bin-packing-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Find the package and check its version matches the tag
        id: pkg
        run: |
          name="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          test -f "packages/$name/package.json" || { echo "No package for tag $GITHUB_REF_NAME"; exit 1; }
          test "$(node -p "require('./packages/$name/package.json').version")" = "$version"
          echo "dir=packages/$name" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run verify
      - run: npm publish -w ${{ steps.pkg.outputs.dir }}
